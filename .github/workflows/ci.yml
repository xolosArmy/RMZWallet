name: CI

on:
  push:
    branches:
      - main
      - feat/canonical-tm1-protocol
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RMZWallet
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Checkout tonalli-memo for canonical protocol package
        uses: actions/checkout@v4
        with:
          repository: xolosarmy/tonalli-memo
          path: .tonalli-memo-temp
          ref: feat/canonical-tm1-protocol

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Build canonical protocol package
        run: |
          cd .tonalli-memo-temp
          pnpm install --frozen-lockfile || pnpm install
          pnpm --filter @xolosarmy/tonalli-memo-protocol build
          cd packages/protocol
          PROTOCOL_TARBALL=$(npm pack)
          mv "$PROTOCOL_TARBALL" "$GITHUB_WORKSPACE/tonalli-memo-protocol.tgz"
          cd "$GITHUB_WORKSPACE"
          rm -rf .tonalli-memo-temp

      - name: Stage canonical protocol package
        run: |
          mkdir -p node_modules/@xolosarmy/tonalli-memo-protocol
          tar -xzf "$GITHUB_WORKSPACE/tonalli-memo-protocol.tgz" --strip-components=1 -C node_modules/@xolosarmy/tonalli-memo-protocol
          rm "$GITHUB_WORKSPACE/tonalli-memo-protocol.tgz"

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: TM1 Canonical Test Vectors (Anti-Drift Gate)
        run: npx vitest run src/integrations/tonalliMemo/tm1CanonicalVectors.test.ts

      - name: TM1 Canonical Anti-Drift Architecture Defense
        run: npx vitest run src/integrations/tonalliMemo/tm1CanonicalAntiDrift.architecture.test.ts

      - name: TM1 Integrations Tests
        run: npx vitest run src/integrations/tonalliMemo

      - name: Test Suite
        run: npm test

      - name: Build
        run: npm run build
