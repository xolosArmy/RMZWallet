name: CI

on:
  push:
    branches:
      - main
      - feat/canonical-tm1-protocol
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RMZWallet
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          scope: '@xolosarmy'

      - name: Install dependencies via npm ci
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: TM1 Canonical Test Vectors (Anti-Drift Gate)
        run: npx vitest run src/integrations/tonalliMemo/tm1CanonicalVectors.test.ts

      - name: TM1 Canonical Anti-Drift Architecture Defense
        run: npx vitest run src/integrations/tonalliMemo/tm1CanonicalAntiDrift.architecture.test.ts

      - name: TM1 Integrations Tests
        run: npx vitest run src/integrations/tonalliMemo

      - name: Test Suite
        run: npm test

      - name: Build
        run: npm run build
