name: CI

on:
  push:
    branches:
      - main
      - feat/canonical-tm1-protocol
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RMZWallet
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Checkout tonalli-memo for canonical protocol package
        uses: actions/checkout@v4
        with:
          repository: xolosarmy/tonalli-memo
          path: .tonalli-memo-temp
          ref: feat/canonical-tm1-protocol

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Build canonical protocol package
        run: |
          cd .tonalli-memo-temp
          pnpm install --frozen-lockfile || pnpm install
          pnpm --filter @xolosarmy/tonalli-memo-protocol build
          cd packages/protocol
          PROTOCOL_TARBALL=$(npm pack)
          mv "$PROTOCOL_TARBALL" "$GITHUB_WORKSPACE/tonalli-memo-protocol.tgz"
          cd "$GITHUB_WORKSPACE"
          rm -rf .tonalli-memo-temp

      - name: Start ephemeral registry for canonical protocol package
        run: |
          node scripts/ci-ephemeral-registry.mjs "$GITHUB_WORKSPACE/tonalli-memo-protocol.tgz" &
          echo "EPHEMERAL_REG_PID=$!" >> $GITHUB_ENV
          sleep 1

      - name: Install dependencies via npm ci
        run: npm ci --registry=http://127.0.0.1:4873 --no-audit

      - name: Stop ephemeral registry
        if: always()
        run: |
          if [ -n "$EPHEMERAL_REG_PID" ]; then
            kill "$EPHEMERAL_REG_PID" || true
          fi
          rm -f "$GITHUB_WORKSPACE/tonalli-memo-protocol.tgz"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: TM1 Canonical Test Vectors (Anti-Drift Gate)
        run: npx vitest run src/integrations/tonalliMemo/tm1CanonicalVectors.test.ts

      - name: TM1 Canonical Anti-Drift Architecture Defense
        run: npx vitest run src/integrations/tonalliMemo/tm1CanonicalAntiDrift.architecture.test.ts

      - name: TM1 Integrations Tests
        run: npx vitest run src/integrations/tonalliMemo

      - name: Test Suite
        run: npm test

      - name: Build
        run: npm run build
